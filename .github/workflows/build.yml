name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build solution
        run: dotnet build CpuCoreVoltageTray.sln --configuration Release
      - name: Run logic tests
        run: dotnet run --project tests/CpuCoreVoltageTray.LogicTests/CpuCoreVoltageTray.LogicTests.csproj --configuration Release --no-build
      - name: Publish Windows executable
        shell: pwsh
        run: ./scripts/publish.ps1 -OutputDirectory ./artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CpuCoreVoltageTray-win-x64
          path: artifacts/win-x64/
          if-no-files-found: error

